<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" rx="6" fill="#000"/>
  <!-- Bed back wall (right edge) -->
  <rect x="26" y="11" width="2" height="11" fill="#50d2be"/>
  <!-- Bed front wall -->
  <rect x="12" y="11" width="2" height="11" fill="#50d2be"/>
  <!-- Bed floor -->
  <rect x="14" y="20" width="12" height="2" fill="#50d2be"/>
  <!-- Cab body -->
  <rect x="4" y="13" width="8" height="9" fill="#50d2be"/>
  <!-- Window -->
  <rect x="5" y="14" width="6" height="3" fill="#1a3d38"/>
  <!-- Front bumper (sticks out left) -->
  <rect x="2" y="20" width="2" height="2" fill="#50d2be"/>
  <!-- Wheels -->
  <rect x="6" y="22" width="4" height="4" fill="#50d2be"/>
  <rect x="20" y="22" width="4" height="4" fill="#50d2be"/>
  <!-- Headlight (front-left) -->
  <rect x="4" y="15" width="1" height="1" fill="#ffbe3c"/>
  <!-- Cargo bytes -->
  <rect x="16" y="6" width="2" height="2" fill="#ffbe3c"/>
  <rect x="20" y="4" width="2" height="2" fill="#50d2be"/>
  <rect x="24" y="6" width="2" height="2" fill="#ffbe3c"/>
</svg>
