  <rect x="108" y="28" width="4" height="4" fill="#1a3d38"/>
  <rect x="138" y="28" width="4" height="4" fill="#1a3d38"/>

  <!-- ============ GROUND LINE ============ -->
  <rect x="0" y="45" width="152" height="2" fill="#1a3d38"/>
  <rect x="0" y="45" width="152" height="1" fill="#3aa090"/>
  <!-- Subtle ground texture (small pebbles/dashes) -->
  <rect x="36" y="47" width="2" height="1" fill="#1a3d38"/>
  <rect x="56" y="47" width="2" height="1" fill="#1a3d38"/>
  <rect x="92" y="47" width="3" height="1" fill="#1a3d38"/>
  <rect x="120" y="47" width="2" height="1" fill="#1a3d38"/>
