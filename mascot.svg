  <!-- Glow under the icon -->
  <rect x="116" y="27" width="14" height="1" fill="#3aa090"/>

  <!-- Mystery silhouettes (future projects, dim) -->
  <!-- Small mystery box on left side of pile -->
  <rect x="104" y="36" width="4" height="4" fill="#1a3d38"/>
  <rect x="105" y="37" width="2" height="2" fill="#2a4a45"/>
  <!-- Small mystery box on right side of pile -->
  <rect x="142" y="36" width="4" height="4" fill="#1a3d38"/>
  <rect x="143" y="37" width="2" height="2" fill="#2a4a45"/>
