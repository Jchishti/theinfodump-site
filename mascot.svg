  <rect x="84" y="36" width="1" height="6" fill="#2a4a45"/>
  <rect x="74" y="43" width="10" height="1" fill="#0a1f1c"/>
  <rect x="76" y="44" width="6" height="1" fill="#0a1f1c"/>
  <rect x="76" y="36" width="6" height="6" fill="#50d2be"/>
  <rect x="76" y="36" width="6" height="1" fill="#7fe8d6"/>
