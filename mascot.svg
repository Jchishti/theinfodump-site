  <rect x="114" y="28" width="26" height="4" fill="#50d2be"/>
  <rect x="114" y="28" width="26" height="1" fill="#7fe8d6"/>

  <!-- "Land" 1 — Linear Timer+ (prominent on the pile, like a level marker) -->
