<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -4 152 54" shape-rendering="crispEdges" aria-label="The InfoDump: a dump truck delivering to a pile of projects, with Linear Timer prominently featured">
  <!-- ============ TRUCK (left side, x=0-92) ============ -->

