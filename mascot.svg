<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" shape-rendering="crispEdges" aria-label="The InfoDump dump truck mascot">
  <!-- Cargo bytes flying out -->
  <g fill="#ffbe3c">
    <rect x="40" y="2" width="2" height="2"/>
    <rect x="50" y="0" width="2" height="2"/>
    <rect x="62" y="2" width="2" height="2"/>
    <rect x="74" y="0" width="2" height="2"/>
  </g>
  <g fill="#7fe8d6">
    <rect x="46" y="2" width="2" height="2"/>
    <rect x="58" y="0" width="2" height="2"/>
    <rect x="70" y="2" width="2" height="2"/>
  </g>

  <!-- Cargo pile peeking above bed wall -->
  <rect x="42" y="6" width="6" height="6" fill="#3aa090"/>
  <rect x="42" y="6" width="6" height="1" fill="#50d2be"/>
  <rect x="50" y="4" width="6" height="8" fill="#3aa090"/>
  <rect x="50" y="4" width="6" height="1" fill="#50d2be"/>
  <rect x="58" y="2" width="6" height="10" fill="#3aa090"/>
  <rect x="58" y="2" width="6" height="1" fill="#50d2be"/>
  <rect x="66" y="6" width="6" height="6" fill="#3aa090"/>
  <rect x="66" y="6" width="6" height="1" fill="#50d2be"/>
  <rect x="74" y="4" width="6" height="8" fill="#3aa090"/>
  <rect x="74" y="4" width="6" height="1" fill="#50d2be"/>
  <rect x="82" y="6" width="6" height="6" fill="#3aa090"/>
  <rect x="82" y="6" width="6" height="1" fill="#50d2be"/>

  <!-- BED -->
  <rect x="36" y="10" width="56" height="22" fill="#0a1f1c"/>
  <rect x="38" y="12" width="52" height="18" fill="#50d2be"/>
  <rect x="38" y="12" width="52" height="2" fill="#7fe8d6"/>
  <rect x="88" y="14" width="2" height="14" fill="#3aa090"/>
  <rect x="38" y="28" width="52" height="2" fill="#3aa090"/>

  <!-- CAB -->
  <rect x="4" y="12" width="32" height="20" fill="#0a1f1c"/>
  <rect x="6" y="14" width="28" height="16" fill="#50d2be"/>
  <rect x="6" y="14" width="28" height="2" fill="#7fe8d6"/>
  <rect x="32" y="16" width="2" height="14" fill="#3aa090"/>
  <rect x="6" y="28" width="28" height="2" fill="#3aa090"/>

  <!-- Window -->
  <rect x="10" y="16" width="20" height="10" fill="#0a1f1c"/>
  <rect x="11" y="17" width="18" height="8" fill="#2a4a45"/>
  <rect x="12" y="18" width="4" height="1" fill="#7fe8d6"/>
  <rect x="13" y="19" width="4" height="1" fill="#7fe8d6"/>
  <rect x="22" y="18" width="3" height="1" fill="#7fe8d6"/>
  <rect x="23" y="19" width="3" height="1" fill="#7fe8d6"/>

  <!-- Side mirror -->
  <rect x="2" y="18" width="2" height="4" fill="#0a1f1c"/>
  <rect x="2" y="19" width="2" height="2" fill="#50d2be"/>
  <rect x="2" y="19" width="2" height="1" fill="#7fe8d6"/>

  <!-- Headlight -->
  <rect x="4" y="22" width="2" height="3" fill="#0a1f1c"/>
  <rect x="4" y="23" width="2" height="2" fill="#ffbe3c"/>
  <rect x="4" y="23" width="2" height="1" fill="#fff5cc"/>

  <!-- Grille -->
  <rect x="4" y="25" width="4" height="3" fill="#0a1f1c"/>
  <rect x="4" y="26" width="4" height="1" fill="#3aa090"/>

  <!-- Front bumper -->
  <rect x="0" y="28" width="8" height="4" fill="#0a1f1c"/>
  <rect x="0" y="29" width="8" height="2" fill="#3aa090"/>
  <rect x="0" y="29" width="8" height="1" fill="#7fe8d6"/>

  <!-- Chassis -->
  <rect x="4" y="32" width="86" height="2" fill="#0a1f1c"/>

  <!-- Fenders -->
  <rect x="10" y="32" width="14" height="2" fill="#50d2be"/>
  <rect x="10" y="32" width="14" height="1" fill="#7fe8d6"/>
  <rect x="56" y="32" width="30" height="2" fill="#50d2be"/>
  <rect x="56" y="32" width="30" height="1" fill="#7fe8d6"/>

  <!-- Front wheel: 3-tone tire (teal highlight, mid, dark shadow) with teal rim and dark hub -->
  <rect x="14" y="33" width="6" height="1" fill="#3aa090"/>
  <rect x="12" y="34" width="10" height="9" fill="#2a4a45"/>
  <rect x="11" y="36" width="1" height="6" fill="#2a4a45"/>
  <rect x="22" y="36" width="1" height="6" fill="#2a4a45"/>
  <rect x="12" y="43" width="10" height="1" fill="#0a1f1c"/>
  <rect x="14" y="44" width="6" height="1" fill="#0a1f1c"/>
  <rect x="14" y="36" width="6" height="6" fill="#50d2be"/>
  <rect x="14" y="36" width="6" height="1" fill="#7fe8d6"/>
  <rect x="14" y="41" width="6" height="1" fill="#3aa090"/>
  <rect x="16" y="38" width="2" height="2" fill="#0a1f1c"/>

  <!-- Rear wheel 1 (tandem, front of pair) -->
  <rect x="62" y="33" width="6" height="1" fill="#3aa090"/>
  <rect x="60" y="34" width="10" height="9" fill="#2a4a45"/>
  <rect x="59" y="36" width="1" height="6" fill="#2a4a45"/>
  <rect x="70" y="36" width="1" height="6" fill="#2a4a45"/>
  <rect x="60" y="43" width="10" height="1" fill="#0a1f1c"/>
  <rect x="62" y="44" width="6" height="1" fill="#0a1f1c"/>
  <rect x="62" y="36" width="6" height="6" fill="#50d2be"/>
  <rect x="62" y="36" width="6" height="1" fill="#7fe8d6"/>
  <rect x="62" y="41" width="6" height="1" fill="#3aa090"/>
  <rect x="64" y="38" width="2" height="2" fill="#0a1f1c"/>

  <!-- Rear wheel 2 (tandem, back of pair) -->
  <rect x="76" y="33" width="6" height="1" fill="#3aa090"/>
  <rect x="74" y="34" width="10" height="9" fill="#2a4a45"/>
  <rect x="73" y="36" width="1" height="6" fill="#2a4a45"/>
  <rect x="84" y="36" width="1" height="6" fill="#2a4a45"/>
  <rect x="74" y="43" width="10" height="1" fill="#0a1f1c"/>
  <rect x="76" y="44" width="6" height="1" fill="#0a1f1c"/>
  <rect x="76" y="36" width="6" height="6" fill="#50d2be"/>
  <rect x="76" y="36" width="6" height="1" fill="#7fe8d6"/>
  <rect x="76" y="41" width="6" height="1" fill="#3aa090"/>
  <rect x="78" y="38" width="2" height="2" fill="#0a1f1c"/>
</svg>
